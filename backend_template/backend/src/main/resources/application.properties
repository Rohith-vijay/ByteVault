# =========================================
# APPLICATION
# =========================================
spring.application.name=platform-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# =========================================
# DATABASE CONFIGURATION
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:platform_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
 
# =========================================
# FLYWAY MIGRATIONS
# =========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
logging.level.com.example.platform=info

# =========================================
# JWT CONFIGURATION
# =========================================
app.jwt.secret=${JWT_SECRET:default_super_secure_jwt_secret_placeholder_minimum_32_chars_long}
app.jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.verification.expiration=${VERIFICATION_EXPIRATION:86400000}

# =========================================
# RATE LIMITING
# =========================================
rate-limit.auth.capacity=10
rate-limit.auth.refill-tokens=10
rate-limit.auth.refill-seconds=60

rate-limit.upload.capacity=3
rate-limit.upload.refill-tokens=3
rate-limit.upload.refill-seconds=60

rate-limit.default.capacity=100
rate-limit.default.refill-tokens=100
rate-limit.default.refill-seconds=60

# =========================================
# COOKIE
# =========================================
app.cookie.secure=false

# =========================================
# SECURITY
# =========================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.mail.enabled=false

# =========================================
# EMAIL CONFIGURATION (Optional by default)
# =========================================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from.name=${APP_MAIL_FROM_NAME:App Notification}
app.mail.from.email=${APP_MAIL_FROM_EMAIL:info@example.com}

# =========================================
# RAZORPAY (Optional by default)
# =========================================
razorpay.key-id=${RAZORPAY_KEY_ID:dummy}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummy}

# =========================================
# CLOUDINARY (Optional by default)
# =========================================
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder-name=${CLOUDINARY_FOLDER_NAME:app_media}

# =========================================
# CLOUDFLARE TURNSTILE (Optional by default)
# =========================================
cloudflare.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:}

# =========================================
# OAUTH2 CLIENT (Optional by default)
# =========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# =========================================
# ENCRYPTION KEY (Required)
# =========================================
app.crypto.encryption-key=${APP_CRYPTO_ENCRYPTION_KEY:dummy_encryption_key_must_be_32_bytes_long!}

# =========================================
# ADMIN ACCOUNT BOOTSTRAP
# =========================================
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
