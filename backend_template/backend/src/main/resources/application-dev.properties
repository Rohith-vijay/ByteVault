# =========================================
# DEVELOPMENT PROFILE OVERRIDES
# Activated via: -Dspring.profiles.active=dev
# =========================================

# Database: H2 In-Memory Database for easy out-of-the-box startup
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable flyway core on H2 in-memory if needed, or allow H2 flyway migration
spring.flyway.clean-disabled=false

# =========================================
# EMAIL / EXTERNAL SERVICES
# =========================================
# SMTP configuration bypass: no emails will be sent out in dev profile if variables are empty
# =========================================

# Development Cookie Hardening
app.cookie.secure=false
