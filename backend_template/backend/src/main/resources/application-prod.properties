# =========================================
# PRODUCTION PROFILE OVERRIDES
# Activated via: -Dspring.profiles.active=prod
# Inherits settings from application.properties
# =========================================

# Database configuration is strictly inherited from application.properties / environment variables

# =========================================
# JPA / HIBERNATE (Production Hardening)
# =========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================
# FLYWAY MIGRATIONS
# =========================================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

# =========================================
# SECURITY & COOKIES (Production)
# =========================================
app.cookie.secure=true

# =========================================
# ERROR HANDLING
# =========================================
server.error.include-stacktrace=never
server.error.include-message=never

# =========================================
# OBSERVABILITY
# =========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =========================================
# FORWARD HEADERS
# =========================================
server.forward-headers-strategy=native

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# =========================================
# TIMEZONE & ENCODING
# =========================================
spring.jackson.time-zone=UTC

# =========================================
# GRACEFUL SHUTDOWN
# =========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =========================================
# LOGGING (Production)
# =========================================
logging.level.root=INFO
logging.level.com.example.platform=INFO
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
logging.level.org.springframework.security=warn
