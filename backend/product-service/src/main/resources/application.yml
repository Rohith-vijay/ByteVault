server:
  port: 8084

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/product_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_BUCKET:bytevault-assets}
    local-fallback-dir: ${LOCAL_STORAGE_DIR:temp-assets}
