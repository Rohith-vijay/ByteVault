server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:bytevault}
    key-store-type: PKCS12
    key-alias: bytevault

spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://localhost:*"
              - "https://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
              - HEAD
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
        add-to-simple-url-handler-mapping: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-auth
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
        - id: identity-user
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/vendors/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
        - id: category-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/categories/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: fulfillment-service
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/v1/fulfillment/**,/api/v1/fulfillments/**,/api/v1/downloads/**,/api/v1/entitlements/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # OpenAPI Documentation Routes
        - id: identity-docs
          uri: lb://identity-service
          predicates:
            - Path=/v3/api-docs/identity-service
          filters:
            - SetPath=/v3/api-docs
        - id: product-docs
          uri: lb://product-service
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - SetPath=/v3/api-docs
        - id: order-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - SetPath=/v3/api-docs
        - id: cart-docs
          uri: lb://cart-service
          predicates:
            - Path=/v3/api-docs/cart-service
          filters:
            - SetPath=/v3/api-docs
        - id: payment-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - SetPath=/v3/api-docs
        - id: fulfillment-docs
          uri: lb://fulfillment-service
          predicates:
            - Path=/v3/api-docs/fulfillment-service
          filters:
            - SetPath=/v3/api-docs
        - id: notification-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Gateway Origin security credentials
app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
  jwt:
    secret: ${JWT_SECRET:default_super_secure_jwt_secret_placeholder_minimum_32_chars_long}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: 1. Identity Service (Auth & Users)
        url: /v3/api-docs/identity-service
      - name: 2. Product Service
        url: /v3/api-docs/product-service
      - name: 3. Order Service
        url: /v3/api-docs/order-service
      - name: 4. Cart Service
        url: /v3/api-docs/cart-service
      - name: 5. Payment Service
        url: /v3/api-docs/payment-service
      - name: 6. Fulfillment Service
        url: /v3/api-docs/fulfillment-service
      - name: 7. Notification Service
        url: /v3/api-docs/notification-service
