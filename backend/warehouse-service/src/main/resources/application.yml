server:
  port: 8092

spring:
  application:
    name: warehouse-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warehouse_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Rohith@358}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
