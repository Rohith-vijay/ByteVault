server:
  port: 8087

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Rohith@358}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Downstream configuration
app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
  outbox:
    poll-interval-ms: 2000

# Payment credentials
razorpay:
  key-id: ${RAZORPAY_KEY_ID:dummy}
  key-secret: ${RAZORPAY_KEY_SECRET:dummy}

