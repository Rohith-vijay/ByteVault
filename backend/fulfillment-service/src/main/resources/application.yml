server:
  port: 8088

spring:
  application:
    name: fulfillment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:fulfillment_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}
        acknowledge-mode: manual
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
