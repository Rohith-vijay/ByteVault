server:
  port: 8088

spring:
  application:
    name: fulfillment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Rohith@358}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}
        acknowledge-mode: manual
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}

