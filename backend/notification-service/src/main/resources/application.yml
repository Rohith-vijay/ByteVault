server:
  port: 8090

spring:
  application:
    name: notification-service
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Mail sending options
app:
  mail:
    from:
      name: ${APP_MAIL_FROM_NAME:App Notification}
      email: ${APP_MAIL_FROM_EMAIL:info@example.com}
  gateway:
    secret: ${GATEWAY_SECRET:platform_default_gateway_shared_secret}
