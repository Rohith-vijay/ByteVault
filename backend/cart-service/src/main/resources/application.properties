# ==============================================================================
# Cart Service Configuration (Phase 1 Final Architecture)
# ==============================================================================

# Server Configuration
server.port=8086

# Application Definition
spring.application.name=cart-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CART_DB_NAME:cart_db}
spring.datasource.username=${CART_DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:${CART_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Persistence
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# API Gateway Shared Secret for Downstream Security
app.gateway.secret=${GATEWAY_SECRET:platform_default_gateway_shared_secret}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
